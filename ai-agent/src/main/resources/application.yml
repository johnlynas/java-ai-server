server:
  port: 8081

spring:
  application:
    name: ai-agent
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: ${OLLAMA_PULL_STRATEGY:when_missing} # never, when_missing, always
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
          temperature: 0.7
    mcp:
      client:
        enabled: ${MCP_CLIENT_ENABLED:true}
        name: nipp-ai-agent-client
        version: 1.0.0
        # Connect to the local mcp-server module (port 8082) via streamable HTTP.
        # Set MCP_CLIENT_ENABLED=false to run without a live mcp-server.
        streamable-http:
          connections:
            nipp-mcp:
              url: ${MCP_SERVER_URL:http://localhost:8082}
              endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info
